# Velocity/acceleration limits are REQUIRED for MoveIt on Jazzy (time parameterization).
# The game scales these down further (operator page speed %).
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1
joint_limits:
  base_link_to_link1:
    has_velocity_limits: true
    max_velocity: 1.0          # rad/s (~57 deg/s)
    has_acceleration_limits: true
    max_acceleration: 2.0
  link1_to_link2:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  link2_to_link3:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  link3_to_gripper_link:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
